name: Itinera
options:
  bundleIdPrefix: com.itinera
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Itinera:
    type: application
    platform: iOS
    sources: [Itinera]
    info:
      path: Itinera/Info.plist
      properties:
        CFBundleDisplayName: Itinera
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          # Allows http://localhost during development; remove for App Store builds.
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itinera.app
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
