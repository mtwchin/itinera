name: Itinera
configs:
  Debug: debug
  Release: release
options:
  bundleIdPrefix: com.itinera
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Debug:
      ITINERA_API_BASE_URL: "http://localhost:8000"
    Release:
      ITINERA_API_BASE_URL: $(ITINERA_PRODUCTION_API_BASE_URL)
targets:
  Itinera:
    type: application
    platform: iOS
    sources:
      - path: Itinera
        excludes: [Info-Debug.plist]
      - path: Shared
    info:
      path: Itinera/Info.plist
      properties:
        CFBundleDisplayName: Itinera
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ItineraAPIBaseURL: $(ITINERA_API_BASE_URL)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSCalendarsWriteOnlyAccessUsageDescription: Itinera adds itinerary stops to your calendar only when you ask it to.
        CFBundleURLTypes:
          - CFBundleURLName: com.itinera.app
            CFBundleURLSchemes: [itinera]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itinera.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Itinera/Itinera.entitlements
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      configs:
        Debug:
          INFOPLIST_FILE: Itinera/Info-Debug.plist
    dependencies:
      - target: ItineraWidget
    preBuildScripts:
      - name: Validate Production API URL
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then
            case "${ITINERA_API_BASE_URL:-}" in
              https://*) ;;
              *)
                echo "error: Set ITINERA_PRODUCTION_API_BASE_URL to the deployed HTTPS API."
                exit 1
                ;;
            esac
          fi
  ItineraTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ItineraTests]
    dependencies:
      - target: Itinera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itinera.app.tests
        GENERATE_INFOPLIST_FILE: YES
  ItineraUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ItineraUITests]
    dependencies:
      - target: Itinera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itinera.app.uitests
        GENERATE_INFOPLIST_FILE: YES
  ItineraWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ItineraWidget
      - path: Shared
    info:
      path: ItineraWidget/Info.plist
      properties:
        CFBundleDisplayName: Itinera
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itinera.app.widget
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: ItineraWidget/ItineraWidget.entitlements
schemes:
  Itinera:
    build:
      targets:
        Itinera: all
        ItineraTests: [test]
        ItineraWidget: all
    test:
      config: Debug
      targets:
        - name: ItineraTests
        - name: ItineraUITests
