# Render Blueprint — deploys the API, outbox dispatcher, Celery worker,
# Postgres, and Redis.
# Docs: https://render.com/docs/blueprint-spec
#
# Before production generation, set the API's AUTH_JWT_SECRET and the worker's
# selected composer, trends-feed, and Apple Maps credentials. Credentials are
# intentionally scoped to the process role that consumes them.
#
# Everything runs from the same Dockerfile, so moving to AWS/GCP later is a
# matter of pointing ECS/Cloud Run at the same image.

databases:
  - name: itinera-db
    plan: basic-256mb

services:
  - type: keyvalue
    name: itinera-redis
    plan: free
    ipAllowList: []  # internal connections only

  - type: web
    name: itinera-api
    runtime: docker
    plan: starter
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile
    healthCheckPath: /readyz
    maxShutdownDelaySeconds: 300
    preDeployCommand: sh -c "alembic upgrade head && python scripts/seed_public_itineraries.py"
    dockerCommand: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips="*"
    envVars:
      - key: ENV
        value: prod
      - key: API_REQUEST_MAX_BODY_BYTES
        value: "262144"
      - key: DATABASE_URL
        fromDatabase:
          name: itinera-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: itinera-redis
          property: connectionString
      - key: REDIS_OPERATION_TIMEOUT_SECONDS
        value: "0.5"
      - key: READINESS_CHECK_TIMEOUT_SECONDS
        value: "2"
      - key: READINESS_CACHE_TTL_SECONDS
        value: "2"
      - key: AUTH_JWT_SECRET
        sync: false
      - key: AUTH_JWT_ISSUER
        value: itinera-api
      - key: AUTH_JWT_AUDIENCE
        value: itinera-ios
      - key: APPLE_SIGN_IN_CLIENT_ID
        sync: false
      - key: GENERATION_ADMISSION_ENABLED
        # Operator-owned: rollout requires false until the complete P2 fleet is
        # verified behind Render Maintenance Mode.
        sync: false
      - key: GENERATION_DISABLED_RETRY_AFTER_SECONDS
        value: "60"
      - key: ADMISSION_UNAVAILABLE_RETRY_AFTER_SECONDS
        value: "5"
      - key: RATE_LIMIT_GENERATIONS_PER_WINDOW
        value: "10"
      - key: RATE_LIMIT_GLOBAL_GENERATIONS_PER_WINDOW
        value: "1000"
      - key: RATE_LIMIT_GUEST_SESSIONS_PER_WINDOW
        value: "20"
      - key: RATE_LIMIT_GLOBAL_GUEST_SESSIONS_PER_WINDOW
        value: "5000"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "3600"
      - key: ITINERARY_STREAM_RECONCILE_SECONDS
        value: "2"
      - key: ITINERARY_STREAM_MAX_SECONDS
        value: "300"
      - key: ITINERARY_STREAM_DATABASE_TIMEOUT_SECONDS
        value: "3"
      # Dedicated SSE reconciliation pool. With the API SQLAlchemy pool's
      # 10 regular + 20 overflow ceiling, this makes the per-instance maximum
      # 10 + 20 + 10 = 40 PostgreSQL connections.
      - key: ITINERARY_STREAM_DATABASE_POOL_SIZE
        value: "10"
      - key: ITINERARY_STREAM_MAX_CONNECTIONS_PER_PRINCIPAL
        value: "2"
      - key: ITINERARY_STREAM_LEASE_TTL_SECONDS
        value: "30"
      - key: ITINERARY_STREAM_LEASE_RENEW_SECONDS
        value: "10"
      - key: ITINERARY_EDITOR_MAX_OUTPUT_TOKENS
        value: "8000"
      # AI edits execute synchronously in the API process. Keep this provider
      # selection identical to the generation worker and expose no discovery,
      # maps, or other worker-only credentials here.
      - key: ITINERARY_COMPOSER_PROVIDER
        value: deepseek
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: OPENAI_REQUEST_TIMEOUT_SECONDS
        value: "90"

  - type: worker
    name: itinera-worker
    runtime: docker
    plan: starter
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile
    preDeployCommand: alembic upgrade head
    dockerCommand: sh -c "python -m backend.workers.preflight && exec celery -A backend.workers.celery_app:celery_app worker --loglevel=info --concurrency=4"
    # This list is intentionally explicit. The selected OpenAI credential is
    # also supplied to the API because authenticated AI edits run there;
    # discovery, maps, and local-provider credentials remain worker-only.
    envVars:
      - key: ENV
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: itinera-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: itinera-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: itinera-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: itinera-redis
          property: connectionString
      - key: CELERY_BROKER_VISIBILITY_TIMEOUT_SECONDS
        value: "180"
      - key: ITINERARY_JOB_LEASE_SECONDS
        value: "150"
      - key: ITINERARY_JOB_SOFT_TIME_LIMIT_SECONDS
        value: "105"
      - key: ITINERARY_JOB_TIME_LIMIT_SECONDS
        value: "120"
      - key: ITINERARY_JOB_LEASE_COMPLETION_MARGIN_SECONDS
        value: "30"
      - key: ITINERARY_COMPOSER_PROVIDER
        value: deepseek
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: OPENAI_REQUEST_TIMEOUT_SECONDS
        value: "90"
      # Retained for deployments that switch back to a private, authenticated
      # Ollama service. Render cannot reach the developer's laptop.
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_MODEL
        value: qwen2.5:7b-instruct
      - key: OLLAMA_REQUEST_TIMEOUT_SECONDS
        value: "90"
      - key: TRENDS_PROVIDER
        value: http
      - key: TRENDS_FEED_URL
        sync: false
      - key: TRENDS_FEED_API_KEY
        sync: false
      - key: MAPS_PROVIDER
        value: apple
      - key: APPLE_MAPS_TEAM_ID
        sync: false
      - key: APPLE_MAPS_KEY_ID
        sync: false
      - key: APPLE_MAPS_PRIVATE_KEY
        sync: false

  - type: worker
    name: itinera-outbox
    runtime: docker
    plan: starter
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile
    preDeployCommand: alembic upgrade head
    dockerCommand: python -m backend.workers.outbox_dispatcher
    envVars:
      - key: ENV
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: itinera-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: itinera-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: itinera-redis
          property: connectionString
      - key: OUTBOX_REDISPATCH_INITIAL_SECONDS
        value: "15"
      - key: OUTBOX_REDISPATCH_MAX_SECONDS
        value: "120"
