<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itinera - AI Travel Planner</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Input Section -->
        <div class="form-section" id="formSection">
            <div class="logo">
                <h1>Itinera</h1>
                <p>AI-powered travel planning from TikTok trends</p>
            </div>

            <form id="itineraryForm">
                <!-- Essential Info -->
                <div class="form-section-group">
                    <h2>Where are you going?</h2>
                    
                    <div class="input-group">
                        <input type="text" id="city" name="city" placeholder="City" required>
                        <input type="text" id="country" name="country" placeholder="Country" required>
                    </div>

                    <input type="text" id="homeLocation" name="homeLocation" 
                           placeholder="Home location (e.g., San Francisco, USA)" required>
                </div>

                <!-- Trip Details -->
                <div class="form-section-group">
                    <h2>Trip details</h2>
                    
                    <div class="input-row">
                        <div class="input-field">
                            <label>Days</label>
                            <input type="number" id="lengthOfStay" name="lengthOfStay" 
                                   min="1" max="30" value="3" required>
                        </div>
                        <div class="input-field">
                            <label>Travelers</label>
                            <input type="number" id="groupSize" name="groupSize" 
                                   min="1" max="50" value="2" required>
                        </div>
                        <div class="input-field">
                            <label>Budget</label>
                            <select id="budget" name="budget">
                                <option value="Budget">$</option>
                                <option value="Medium" selected>$$</option>
                                <option value="Luxury">$$$</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Preferences (Collapsible) -->
                <details class="preferences-section">
                    <summary>Preferences (optional)</summary>
                    <div class="preferences-content">
                        <input type="text" id="foodPreferences" name="foodPreferences" 
                               placeholder="Food preferences (e.g., vegetarian, seafood)">
                        
                        <textarea id="mustDo" name="mustDo" rows="2" 
                                  placeholder="Must-do activities or places..."></textarea>
                    </div>
                </details>

                <button type="submit" class="btn-primary" id="generateBtn">
                    <span class="btn-text">Generate Itinerary</span>
                    <span class="btn-loader" style="display: none;">
                        <span class="spinner"></span>
                    </span>
                </button>
            </form>
        </div>

        <!-- Results Section -->
        <div class="results-section" id="resultsSection" style="display: none;">
            <div class="results-header">
                <div class="header-left">
                    <h1 id="tripTitle"></h1>
                    <p id="tripSubtitle"></p>
                </div>
                <button class="btn-reset" onclick="resetForm()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                        <path d="M3 3v5h5"></path>
                    </svg>
                    New Trip
                </button>
            </div>

            <!-- Day Tabs -->
            <div class="day-tabs" id="dayTabs"></div>

            <!-- Content Grid -->
            <div class="content-layout">
                <!-- Itinerary Panel -->
                <div class="itinerary-panel">
                    <div id="itineraryContent"></div>
                </div>

                <!-- Map Panel -->
                <div class="map-panel">
                    <div id="map"></div>
                    <div class="map-actions">
                        <button class="btn-secondary" onclick="exportToGoogleMaps()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                                <circle cx="12" cy="10" r="3"></circle>
                            </svg>
                            Open in Google Maps
                        </button>
                    </div>
                </div>
            </div>

            <!-- Tips & Refinement -->
            <div class="bottom-section">
                <div class="tips-card" id="tipsCard" style="display: none;">
                    <h3>💡 Tips</h3>
                    <ul id="tipsList"></ul>
                    <div class="budget-info" id="budgetInfo"></div>
                </div>

                <div class="refine-card">
                    <h3>Make changes</h3>
                    <textarea id="refineFeedback" 
                              placeholder="e.g., Add more food stops, less walking, swap day 2 and 3..."></textarea>
                    <button class="btn-secondary" onclick="refineItinerary()">Update Itinerary</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
